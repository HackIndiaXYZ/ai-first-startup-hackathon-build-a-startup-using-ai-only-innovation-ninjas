<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Government AI Assistant</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="chat-container">

        <!-- Header -->
        <header class="chat-header">

            <div class="logo">
                🏛️
            </div>

            <div>
                <h2>Government AI</h2>
                <p>Tamil Nadu Citizen Assistant</p>
            </div>

        </header>


        <!-- Chat Area -->
        <main class="chat-area" id="chatArea">

            <!-- Welcome Message -->
            <div class="message ai-message">

                <div class="avatar">
                    🤖
                </div>

                <div class="message-content">

                    <p>Hello! 👋</p>

                    <p>
                        I'm your Government AI Assistant.
                        How can I help you today?
                    </p>

                    <p class="example-text">
                        You can ask about government schemes,
                        jobs, services, certificates, land,
                        revenue and other government information.
                    </p>

                </div>

            </div>

        </main>


        <!-- Input Area -->
        <footer class="chat-input-area">

            <input
                type="text"
                id="userInput"
                placeholder="Ask your government-related question..."
                autocomplete="off"
            >

            <button
                id="voiceButton"
                class="voice-btn"
                title="Voice input">
                🎤
            </button>

            <button
                id="sendButton"
                class="send-btn"
                title="Send message">
                ➤
            </button>

        </footer>

    </div>


    <script src="script.js"></script>

</body>

</html>
